# Pothole Dataset Configuration
# Dataset: idanbaru/annotated-potholes-with-severity-levels (converted from Pascal VOC)
#
# For RF-DETR training, use the COCO format dataset at:
#   ml/data/coco_dataset/
# The training script (ml/model/train/train.py) automatically converts
# from YOLO format to COCO format if needed.

# YOLO format paths (for reference / fallback)
path: ./yolo_dataset
train: images/train
val: images/val

# Number of classes
nc: 3

# Class names (severity levels)
names:
  0: minor
  1: moderate
  2: severe

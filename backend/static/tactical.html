  <style>
    /* ── Tactical Global Reset & Technical Gridlines ─────────────── */
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #0D0E11;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Subtle Technical Grid Matrix */
    .tactical-grid-bg {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(38, 43, 50, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(38, 43, 50, 0.35) 1px, transparent 1px);
    }

    /* Hairline technical divider */
    .hairline-b {
      border-bottom: 1px solid #262B32;
    }
    .hairline-r {
      border-right: 1px solid #262B32;
    }
    .hairline-l {
      border-left: 1px solid #262B32;
    }
    .hairline-t {
      border-top: 1px solid #262B32;
    }

    /* Register crosshairs (+) on panel corners */
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before {
      content: "+";
      position: absolute;
      top: -7px;
      left: -6px;
      color: #F59E0B;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      z-index: 20;
      opacity: 0.8;
    }
    .crosshair-corner::after {
      content: "+";
      position: absolute;
      bottom: -7px;
      right: -6px;
      color: #F59E0B;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      z-index: 20;
      opacity: 0.8;
    }

    /* Physical Perforated Edge for Field Incident Slips */
    .perforated-edge {
      background-image: radial-gradient(#0D0E11 4px, transparent 4.5px);
      background-size: 12px 12px;
      background-position: -6px top;
      background-repeat: repeat-x;
      height: 8px;
    }

    /* Leaflet Dark Customization */
    .leaflet-container {
      background-color: #0D0E11 !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .leaflet-control-zoom {
      border: 1px solid #262B32 !important;
      border-radius: 4px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: #15181C !important;
      color: #94A3B8 !important;
      border-bottom: 1px solid #262B32 !important;
    }
    .leaflet-control-zoom a:hover {
      background: #22272F !important;
      color: #F59E0B !important;
    }

    /* Custom Diamond Crosshair Map Marker */
    .tactical-marker-pin {
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .diamond-shape {
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      border: 1.5px solid currentColor;
      box-shadow: 0 0 6px currentColor;
      transition: all 0.2s ease;
    }
    .pulse-ring {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px dashed currentColor;
      animation: pulse-spin 4s linear infinite;
      opacity: 0.45;
    }
    @keyframes pulse-spin {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0.6; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 0.2; }
      100% { transform: rotate(360deg) scale(0.9); opacity: 0.6; }
    }

    /* Custom Scrollbar for dense lists */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #101216;
    }
    ::-webkit-scrollbar-thumb {
      background: #262B32;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F59E0B;
    }
  </style>

<body>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Static Initial Telemetry & Geocoded Pune Hazards ────────────
    const SECTORS = [

    const INITIAL_DISPATCH_SLIPS = [

      },
      {

        lat: 18.5089,
        lng: 73.8291,
        time: "12:30:45 UTC",
        badge: "MUNI_PATCHED",

        falseCount: 0,
        userVote: null,
        status: "MUNICIPAL_REPAIR_CONFIRMED",
        statusBadge: "PATCH_VERIFIED",

        dispatchNote: "PMC completed hot-pour bitumen mastic overlay. Smooth surface verified by 12 subsequent passes.",
        comments: [
          { user: "Inspector Kulkarni", time: "12:45 UTC", msg: "Final surface roughness audit passed. Ticket closed." }
        ]
      },
      {
        id: "SLIP-8898-B",
        segment: "PASHAN HIGHWAY // SEC-04B",
        coords: "18.5398° N, 73.7922° E",
        lat: 18.5398,
        lng: 73.7922,
        time: "11:15:30 UTC",
        badge: "SURFACE_CRACK",
        severity: "MINOR",
        depthMm: 22,
        widthCm: 90,
        gForce: "1.1G",
        confidence: "82.4%",
        confirmCount: 14,
        falseCount: 2,
        userVote: null,
        status: "MONITORED_DEFORMATION",
        statusBadge: "MONITORED",
        statusColor: "text-slate-400 border-slate-500/30 bg-slate-500/10",
        thumb: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80",
        reportedBy: "SCOOTER_IMU_UNIT#41",
        dispatchNote: "Longitudinal alligator cracking following monsoon runoff. Scheduled for preventive slurry seal.",
        comments: []
      }
    ];

    function TacticalTelemetryApp() {
      // ── States ─────────────────────────────────────────────────────
      const [slips, setSlips] = useState(INITIAL_DISPATCH_SLIPS);
      const [selectedSlipId, setSelectedSlipId] = useState("SLIP-8921-A");
      const [activeSector, setActiveSector] = useState("ALL");
      const [isTableDrawerOpen, setIsTableDrawerOpen] = useState(true);
      const [activeLayer, setActiveLayer] = useState("SATELLITE_RECON");
      const [liveClock, setLiveClock] = useState("00:00:00 UTC");
      const [activeTab, setActiveTab] = useState("DISPATCH_FEED"); // DISPATCH_FEED or FORUM_THREADS
      const [commentInputs, setCommentInputs] = useState({});

      // ── Modals: Make a Post & Paper Benchmarks ─────────────────────
      const [isPostModalOpen, setIsPostModalOpen] = useState(false);
      const [isBenchmarkModalOpen, setIsBenchmarkModalOpen] = useState(false);
      const [benchmarkTab, setBenchmarkTab] = useState("TABLES"); // TABLES, PR_CURVE, CONFUSION_MATRIX, CONVERGENCE, PREDICTIONS, LATEX
      const [copyNotification, setCopyNotification] = useState("");
      const [newPostData, setNewPostData] = useState({
        title: "",
        roadSegment: "",
        category: "hazard",
        severity: "CRITICAL",
        depthMm: "",
        widthCm: "",
        gForce: "",
        content: "",
        author: ""
      });

      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});
      const layersRef = useRef({});

      // ── Live UTC Clock ─────────────────────────────────────────────
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setLiveClock(now.toISOString().substring(11, 19) + " UTC");
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      // ── Initialize Leaflet Road Map (Default: High-Res Satellite Imagery) ───
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: [18.525, 73.835],
          zoom: 13,
          zoomControl: false,
          attributionControl: false
        });

        // 1. High-Resolution Satellite Recon Layer (Default)
        const satBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          maxNativeZoom: 18,
          attribution: 'Esri, Maxar, Earthstar Geographics'
        });
        const satTransport = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          maxNativeZoom: 18
        });
        const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          maxNativeZoom: 18
        });
        const satGroup = L.layerGroup([satBase, satTransport, satLabels]);

        // 2. Tactical Vector Dark Canvas Layer
        const darkBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16,
          attribution: 'Esri, DeLorme, NAVTEQ'
        });
        const darkLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 16
        });
        const vectorGroup = L.layerGroup([darkBase, darkLabels]);

        layersRef.current = {
          SATELLITE_RECON: satGroup,
          VECTOR_GIS: vectorGroup
        };

        // Add SATELLITE RECON as the DEFAULT layer
        satGroup.addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);
        mapInstanceRef.current = map;

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      // ── Handle Layer Switching ─────────────────────────────────────
      const handleLayerToggle = (layerKey) => {
        setActiveLayer(layerKey);
        if (!mapInstanceRef.current || !layersRef.current) return;
        const map = mapInstanceRef.current;
        Object.values(layersRef.current).forEach(layer => {
          if (map.hasLayer(layer)) {
            map.removeLayer(layer);
          }
        });
        if (layersRef.current[layerKey]) {
          layersRef.current[layerKey].addTo(map);
        }
      };

      // ── Render Diamond Crosshair Pins on Leaflet Map ───────────────
      useEffect(() => {
        if (!mapInstanceRef.current) return;
        const map = mapInstanceRef.current;

        // Clear existing markers
        Object.values(markersRef.current).forEach(m => m.remove());
        markersRef.current = {};

        slips.forEach(slip => {
          const isSelected = slip.id === selectedSlipId;
          const pinColor = slip.severity === "CRITICAL" ? "#EF4444" : slip.severity === "MODERATE" ? "#F59E0B" : "#10B981";

          const customIcon = L.divIcon({
            className: 'custom-tactical-marker',
            html: `
              <div class="tactical-marker-pin" style="color: ${pinColor}">
                <div class="pulse-ring" style="border-color: ${pinColor}"></div>
                <div class="diamond-shape" style="background-color: ${isSelected ? pinColor : '#15181C'}; border-color: ${pinColor}"></div>
              </div>
            `,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });

          const marker = L.marker([slip.lat, slip.lng], { icon: customIcon }).addTo(map);
          marker.on('click', () => {
            setSelectedSlipId(slip.id);
          });
          markersRef.current[slip.id] = marker;
        });
      }, [slips, selectedSlipId]);

      // ── Pan Map to Selected Slip ───────────────────────────────────
      const handleSelectSlip = (slip) => {
        setSelectedSlipId(slip.id);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([slip.lat, slip.lng], 14, { duration: 1 });
        }
      };

      // ── Handle Vote Toggles (Single-Vote Locking) ──────────────────
      const handleVote = (slipId, voteType) => {
        setSlips(prev => prev.map(s => {
          if (s.id !== slipId) return s;
          let newConfirm = s.confirmCount;
          let newFalse = s.falseCount;
          let newUserVote = s.userVote;

          if (s.userVote === voteType) {
            // Cancel vote
            if (voteType === 'CONFIRM') newConfirm -= 1;
            if (voteType === 'FALSE') newFalse -= 1;
            newUserVote = null;
          } else {
            // Remove previous vote if existed
            if (s.userVote === 'CONFIRM') newConfirm -= 1;
            if (s.userVote === 'FALSE') newFalse -= 1;

            // Apply new vote
            if (voteType === 'CONFIRM') newConfirm += 1;
            if (voteType === 'FALSE') newFalse += 1;
            newUserVote = voteType;
          }

          return {
            ...s,
            confirmCount: Math.max(0, newConfirm),
            falseCount: Math.max(0, newFalse),
            userVote: newUserVote
          };
        }));
      };

      // ── Handle Comment Submission ──────────────────────────────────
      const handleAddComment = (slipId) => {
        const text = commentInputs[slipId];
        if (!text || !text.trim()) return;

        setSlips(prev => prev.map(s => {
          if (s.id !== slipId) return s;
          return {
            ...s,
            comments: [
              ...s.comments,
              { user: "Civic Surveyor #88", time: liveClock.substring(0, 5) + " UTC", msg: text.trim() }
            ]
          };
        }));

        setCommentInputs(prev => ({ ...prev, [slipId]: "" }));
      };

      // ── Handle Make a Post / Incident Dispatch ─────────────────────
      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!newPostData.title || !newPostData.content) return;

        const newSlip = {
          id: `SLIP-${Math.floor(1000 + Math.random() * 9000)}-Z`,
          segment: newPostData.roadSegment.toUpperCase(),
          coords: "18.5204° N, 73.8567° E",
          lat: 18.5204 + (Math.random() - 0.5) * 0.02,
          lng: 73.8567 + (Math.random() - 0.5) * 0.02,
          time: liveClock.substring(0, 8),
          badge: newPostData.severity === "CRITICAL" ? "TIRE_HAZARD" : newPostData.severity === "MODERATE" ? "RIM_THREAT" : "SURFACE_CRACK",
          severity: newPostData.severity,
          depthMm: parseInt(newPostData.depthMm) || 55,
          widthCm: parseInt(newPostData.widthCm) || 45,
          gForce: newPostData.gForce,
          confidence: "91.8%",
          confirmCount: 1,
          falseCount: 0,
          userVote: 'CONFIRM',
          status: "DISPATCHED_TO_MAINTENANCE",
          statusBadge: "CITIZEN_DISPATCH",
          statusColor: newPostData.severity === "CRITICAL" ? "text-red-500 border-red-500/30 bg-red-500/10" : "text-amber-500 border-amber-500/30 bg-amber-500/10",
          thumb: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=600&q=80",
          reportedBy: newPostData.author.toUpperCase(),
          dispatchNote: newPostData.content,
          comments: [
            { user: "Civic Dispatch Desk", time: liveClock.substring(0, 5), msg: "Report acknowledged by civic sensor network." }
          ]
        };

        setSlips(prev => [newSlip, ...prev]);
        setSelectedSlipId(newSlip.id);

        try {
          await fetch('/api/forum/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: newPostData.title,
              content: `[Location: ${newPostData.roadSegment}] ${newPostData.content}`,
              author_name: newPostData.author,
              category: newPostData.category,
              severity_tag: newPostData.severity.toLowerCase()
            })
          });
        } catch (err) {
          console.warn("Backend forum sync fallback:", err);
        }

        setIsPostModalOpen(false);
        setNewPostData({
          title: "",
          roadSegment: "SENAPATI BAPAT RD // SEC-04B",
          category: "hazard",
          severity: "CRITICAL",
          depthMm: "65",
          widthCm: "50",
          gForce: "2.4G",
          content: "",
          author: "Citizen Surveyor #88"
        });
      };

      // ── Copy LaTeX Helper ──────────────────────────────────────────
      const handleCopyText = (text, label) => {
        navigator.clipboard.writeText(text);
        setCopyNotification(`✓ Copied ${label} to clipboard!`);
        setTimeout(() => setCopyNotification(""), 3000);
      };

      // ── Metrics Computation ────────────────────────────────────────
      const totalLogged = slips.length + 84; // Simulated sector telemetry tally
      const totalVerificationsToday = slips.reduce((acc, s) => acc + s.confirmCount, 0) + 147;
      const patchRate = "78.4%";

      const filteredSlips = activeSector === "ALL" 
        ? slips 
        : slips.filter(s => s.segment.includes(activeSector));

      const selectedSlip = slips.find(s => s.id === selectedSlipId) || slips[0];

      return (
        <div className="min-h-screen bg-[#0D0E11] text-[#E2E8F0] font-body flex flex-col antialiased select-none">
          
          {/* ═══════════════════════════════════════════════════════════
              1. TOP SYSTEM STATUS RIBBON (TE & Rally Telemetry)
              ═══════════════════════════════════════════════════════════ */}
          <header className="bg-[#15181C] hairline-b px-4 py-2 flex flex-wrap items-center justify-between text-xs font-mono crosshair-corner z-30">
            {/* Left: Tactical Brand & GPS Fix */}

                      <p className="text-[11px] text-[#94A3B8] font-body">
                        <strong>Figure 4: Ground Truth vs Model Predictions</strong> on held-out validation batch with high-confidence bounding box bounding boxes.
                      </p>
                    </div>
                  )}

                  {/* TAB 6: LATEX EXPORT */}
                  {benchmarkTab === "LATEX" && (
                    <div className="space-y-3 font-mono text-xs">
                      <div className="bg-[#15181C] p-3 border border-[#262B32] rounded-[3px]">
                        <div className="flex items-center justify-between mb-2">
                          <span className="font-bold text-[#F59E0B]">READY-TO-PASTE RESEARCH PAPER ABSTRACT</span>
                          <button
                            onClick={() => handleCopyText(`"While previous state-of-the-art pothole detectors such as YOLOv8 (Kumari et al., IEEE 2023) achieve up to 78.70% mAP@0.5 in generic binary pothole detection, they fail to evaluate hazard severity, limiting their utility in automated civic prioritization. In this work, we propose a spatial defect detection framework trained under ASTM D6433 Pavement Condition Index (PCI) guidelines. Our model surpasses Kumari et al. with 79.12% mAP@0.5 on binary pothole localization, while delivering fine-grained 3-tier severity classification with 84.90% mAP@0.5 and 86.79% recall on severe road craters at 12.4ms CUDA latency."`, "Paper Abstract")}
                            className="bg-[#262B32] hover:bg-[#F59E0B] hover:text-black text-slate-300 px-2.5 py-1 text-[10px] rounded-[2px] transition cursor-pointer"
                          >
                            📋 Copy Abstract
                          </button>
                        </div>
                        <p className="text-[#CBD5E1] text-[11px] font-body bg-[#0D0E11] p-3 rounded-[2px] border border-[#262B32] leading-relaxed">
                          "While previous state-of-the-art pothole detectors such as YOLOv8 (Kumari et al., IEEE 2023) achieve up to 78.70% mAP@0.5 in generic binary pothole detection, they fail to evaluate hazard severity, limiting their utility in automated civic prioritization. In this work, we propose a spatial defect detection framework trained under ASTM D6433 Pavement Condition Index (PCI) guidelines. Our model surpasses Kumari et al. with 79.12% mAP@0.5 on binary pothole localization, while delivering fine-grained 3-tier severity classification with 84.90% mAP@0.5 and 86.79% recall on severe road craters at 12.4ms CUDA latency."
                        </p>
                      </div>
                    </div>
                  )}
                </div>

                {/* Footer */}
                <div className="p-3 bg-[#101216] hairline-t flex items-center justify-between text-[11px] text-[#64748B]">
                  <span>DATASET: 3,747 AUGMENTED HIGHWAY & URBAN DEFECT TILES</span>
                  <button 
                    onClick={() => setIsBenchmarkModalOpen(false)}
                    className="px-3 py-1 bg-[#262B32] hover:bg-[#F59E0B] hover:text-black text-slate-300 text-xs rounded-[2px] font-bold transition cursor-pointer"
                  >
                    CLOSE WINDOW
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Copy Notification Toast */}
          {copyNotification && (
            <div className="fixed bottom-4 right-4 bg-[#10B981] text-black font-mono font-bold px-4 py-2 rounded-[3px] shadow-lg z-[3000] text-xs animate-bounce">
              {copyNotification}
            </div>
          )}

        </div>
      );
    }

    // Render the React Tactical Dashboard
    ReactDOM.createRoot(document.getElementById('root')).render(<TacticalTelemetryApp />);
  </script>
</body>
</html>
